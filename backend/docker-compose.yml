services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: financecontrol
      POSTGRES_USER: financecontrol
      POSTGRES_PASSWORD: ${FINANCECONTROL_DB_PASSWORD:?defina FINANCECONTROL_DB_PASSWORD}
    ports:
      - "127.0.0.1:${FINANCECONTROL_DB_PORT:-55432}:5432"
    volumes:
      - financecontrol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financecontrol -d financecontrol"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/src/FinanceControl.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${FINANCECONTROL_ENVIRONMENT:-Development}
      Database__ApplyMigrations: "true"
      Auth__AllowLocalRegistration: "true"
      Auth__InviteEmail: ${FINANCECONTROL_INVITE_EMAIL:-}
      Auth__InviteCode: ${FINANCECONTROL_INVITE_CODE:-}
      FINANCECONTROL_CONNECTION_STRING: "Host=postgres;Port=5432;Database=financecontrol;Username=financecontrol;Password=${FINANCECONTROL_DB_PASSWORD:?defina FINANCECONTROL_DB_PASSWORD}"
      FINANCECONTROL_JWT_SECRET: ${FINANCECONTROL_JWT_SECRET:?defina FINANCECONTROL_JWT_SECRET}
    ports:
      - "127.0.0.1:${FINANCECONTROL_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  financecontrol_pgdata:
