services:
  postgres:
    image: postgres:16-alpine
    container_name: financecontrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: financecontrol
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - financecontrol_pgdata:/var/lib/postgresql/data

volumes:
  financecontrol_pgdata:
